# Minimal Docker Compose for development
# Use this for quick local testing

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: crawlee_cloud
    ports:
      - '5432:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    ports:
      - '6379:6379'
    volumes:
      - redis_data:/data

  minio:
    # minio/minio and minio/mc can no longer be pulled (#121). This pins the
    # Bitnami legacy archive as a stopgap; it creates MINIO_DEFAULT_BUCKETS at
    # startup, so no separate mc init job is needed.
    image: bitnamilegacy/minio:2025.7.23-debian-12-r5
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
      MINIO_DEFAULT_BUCKETS: crawlee-cloud
      # Bitnami turns the web console off by default; keep it on :9001 as before.
      MINIO_BROWSER: 'on'
    ports:
      - '9000:9000'
      - '9001:9001'
    volumes:
      - minio_data:/bitnami/minio/data

volumes:
  postgres_data:
  redis_data:
  minio_data:
