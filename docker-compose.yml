services:
  # ===========================================
  # CORE SERVICES
  # ===========================================

  api:
    build:
      context: .
      dockerfile: docker/Dockerfile.api
    ports:
      - '3000:3000'
    environment:
      # Use 'development' for docker-compose local dev; set to 'production' with real secrets in actual deployment
      - NODE_ENV=development
      - PORT=3000
      - DATABASE_URL=postgresql://postgres:postgres@postgres:5432/crawlee_cloud
      - REDIS_URL=redis://redis:6379
      - S3_ENDPOINT=http://minio:9000
      - S3_ACCESS_KEY=minioadmin
      - S3_SECRET_KEY=minioadmin
      - S3_BUCKET=crawlee-cloud
      - S3_REGION=us-east-1
      - S3_FORCE_PATH_STYLE=true
      # API secret must be 32+ chars in production
      - API_SECRET=docker-compose-dev-secret-32chars-change-me
      # CORS origins whitelist
      - CORS_ORIGINS=http://localhost:3000,http://localhost:3001,http://dashboard:3001
      - RATE_LIMIT_MAX=1000
      - LOG_LEVEL=info
      - ADMIN_EMAIL=admin@crawlee.cloud
      - ADMIN_PASSWORD=crawlee.cloud
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy
    networks:
      - crawlee-network
    restart: unless-stopped

  runner:
    build:
      context: .
      dockerfile: docker/Dockerfile.runner
    environment:
      - NODE_ENV=development
      - API_BASE_URL=http://api:3000
      - API_TOKEN=runner-token
      - DATABASE_URL=postgresql://postgres:postgres@postgres:5432/crawlee_cloud
      - REDIS_URL=redis://redis:6379
      - DOCKER_SOCKET=/var/run/docker.sock
      - DOCKER_NETWORK=crawlee-platfrom_crawlee-network
      - MAX_CONCURRENT_RUNS=10
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    depends_on:
      - api
      - redis
      - postgres
    networks:
      - crawlee-network
    restart: unless-stopped

  dashboard:
    build:
      context: .
      dockerfile: docker/Dockerfile.dashboard
    ports:
      - '3001:3001'
    environment:
      - NODE_ENV=development
      - PORT=3001
      - NEXT_PUBLIC_API_URL=http://localhost:3000
    depends_on:
      - api
    networks:
      - crawlee-network
    restart: unless-stopped

  scheduler:
    build:
      context: .
      dockerfile: docker/Dockerfile.api
    command: ['node', 'dist/scheduler.js']
    environment:
      - NODE_ENV=development
      - DATABASE_URL=postgresql://postgres:postgres@postgres:5432/crawlee_cloud
      - REDIS_URL=redis://redis:6379
      - S3_ENDPOINT=http://minio:9000
      - S3_ACCESS_KEY=minioadmin
      - S3_SECRET_KEY=minioadmin
      - S3_BUCKET=crawlee-cloud
      - S3_REGION=us-east-1
      - S3_FORCE_PATH_STYLE=true
      - API_SECRET=docker-compose-dev-secret-32chars-change-me
      - CORS_ORIGINS=http://localhost:3000,http://localhost:3001
    depends_on:
      - api
      - redis
    networks:
      - crawlee-network
    restart: unless-stopped

  # ===========================================
  # DATA STORES (Replaceable with cloud services)
  # ===========================================

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: crawlee_cloud
    ports:
      - '5432:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U postgres']
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - crawlee-network
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    command: redis-server --appendonly yes
    ports:
      - '6379:6379'
    volumes:
      - redis_data:/data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - crawlee-network
    restart: unless-stopped

  minio:
    # minio/minio and minio/mc can no longer be pulled (#121). This pins the
    # Bitnami legacy archive as a stopgap; it creates MINIO_DEFAULT_BUCKETS at
    # startup, so no separate mc init job is needed.
    image: bitnamilegacy/minio:2025.7.23-debian-12-r5
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
      MINIO_DEFAULT_BUCKETS: crawlee-cloud
    ports:
      - '9000:9000' # S3 API
      - '9001:9001' # Console
    volumes:
      - minio_data:/bitnami/minio/data
    healthcheck:
      # Healthy only once the default bucket exists: Bitnami answers on :9000
      # during its setup phase, before MINIO_DEFAULT_BUCKETS is created.
      test:
        [
          'CMD-SHELL',
          'curl -f http://localhost:9000/minio/health/live && test -d /bitnami/minio/data/crawlee-cloud',
        ]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - crawlee-network
    restart: unless-stopped

networks:
  crawlee-network:
    driver: bridge

volumes:
  postgres_data:
  redis_data:
  minio_data:
